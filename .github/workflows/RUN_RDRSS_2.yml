name: Run RDRSS Script 2

on:
  schedule:
    - cron: '28 * * * *'
    - cron: '58 * * * *'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v6

    - name: 파이썬 설치
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        
    - name: 의존성 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        python -m pip install feedparser
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 1. RDRSS 날짜 예외 패치 및 환경 세팅
      env:
        REAL_DEBRID_TOKEN: ${{ secrets.REAL_DEBRID_TOKEN }}
      run: |
        # BT4G 특유의 날짜 없음(TypeError)으로 스크립트가 멈추는 현상 패치
        sed -i "s/if (entry.updated_parsed > last_load_date):/if entry.get('updated_parsed') is None or (entry.updated_parsed > last_load_date):/g" RDRSS.py || true
        if [ ! -z "$REAL_DEBRID_TOKEN" ]; then python RDRSS.py --token "$REAL_DEBRID_TOKEN"; fi

    - name: 2. 멀티 피드 순회 주입 및 실시간 중복 마그넷 차단 구동
      env:
        # =================================================================
        # ⭐ [여기에 수집하고 싶은 피드 주소들을 한 줄에 하나씩 나열하세요] ⭐
        # 앞에 하이픈(-) 없이 정렬 칸에 맞춰 아래로 쭉 적어주시면 됩니다.
        # =================================================================
        MULTI_FEED_URLS: |
          https://bt4gprx.com/search?q=新井リマ&category=movie&page=rss
          https://bt4gprx.com/search?q=Arai%20Rima&category=movie&page=rss
          https://bt4gprx.com/search?q=楓カレン&category=movie&page=rss
          https://bt4gprx.com/search?q=Karen%20Kaede&category=movie&page=rss
          
        # =================================================================
      run: |
        # JSON 관리 로직을 완전히 제거하고 입력한 피드로만 즉시 순회 기동하는 파이썬 멀티 엔진입니다.
        python -c 'import os, feedparser; mf = "RDRSSconfig/sent_magnets2.txt"; os.makedirs("RDRSSconfig", exist_ok=True); open(mf, "a", encoding="utf-8").close() if not os.path.exists(mf) else None; feed_raw = os.environ.get("MULTI_FEED_URLS", "").strip(); feeds = [f.strip() for f in feed_raw.split("\n") if f.strip()]; su = set(l.strip().lower() for l in open(mf, "r", encoding="utf-8").readlines() if l.strip()); print(f"[독립 스캔] 입력된 {len(feeds)}개의 피드를 독립 기동합니다..."); any_new = False; [os.system(f"python RDRSS.py --add \"{f}\"") for f in feeds]; 
        for target in feeds:
            print(f"\n[대상 피드 분석 시작] -> {target[:60]}..."); new_entries = [e for e in feedparser.parse(target).entries if str(e.link).strip().lower() not in su]; [open(mf, "a", encoding="utf-8").write(str(e.link).strip() + "\n") or print(f"[💾 신규 마그넷 주소 강제 기록 완료] {e.title}") for e in new_entries]; 
            if new_entries: any_new = True; print(f"[🚀 신규 건 감지] 중복 제외 새 마그넷 {len(new_entries)}건 발견.")
            else: print(f"[🛑 중복 차단] 이 피드의 모든 마그넷이 이미 과거에 전송되었습니다.")
        os.system("python RDRSS.py") if any_new else print("\n[🏁 최종 결과] 입력한 피드에 새로운 마그넷이 존재하지 않습니다. 작업을 안전하게 완주합니다.")'
        
        # 워크스페이스 내부의 json 파일을 완벽히 삭제하여 Git 추적을 차단합니다.
        rm -f rdrss.json RDRSSconfig/rdrss.json RDRSSconfig/*.json *.json 2>/dev/null || true

    - name: 3. RDRSS 상태 및 마그넷 전체 주소 이력 보존 커밋
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        
        # rdrss.json 파일이 존재하더라도 커밋 대상에서 완벽히 배제하고 무조건 삭제 상태로 동기화합니다.
        git rm -f rdrss.json RDRSSconfig/rdrss.json 2>/dev/null || true
        
        # 오직 마그넷 이력 파일 폴더만 형상관리에 반영합니다.
        git add RDRSSconfig/
        
        if ! git diff --staged --quiet; then
          git commit -m "chore: Synchronize multi-feed configuration and save raw magnet links [skip ci]"
          git push
        fi
