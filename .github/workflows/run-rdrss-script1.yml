name: Run RDRSS Script 1

on:
  schedule:
    - cron: '26,56 * * * *'
  workflow_dispatch: # 수동 실행 버튼

# git push 를 위한 쓰기 권한
permissions:
  contents: write

# 실행이 겹치지 않도록 순차 처리 (진행 중인 실행은 취소하지 않고 대기)
concurrency:
  group: rdrss-script-1
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v6

    - name: 파이썬 설치
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: 의존성 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        python -m pip install feedparser
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 1. RDRSS 날짜 예외 패치 및 토큰 세팅
      env:
        REAL_DEBRID_TOKEN: ${{ secrets.REAL_DEBRID_TOKEN }}
      run: |
        if [ -z "$REAL_DEBRID_TOKEN" ]; then
          echo "::error::REAL_DEBRID_TOKEN 시크릿이 비어 있습니다. 저장소 Settings > Secrets 를 확인하세요."
          exit 1
        fi
        if [ ! -f RDRSS.py ]; then
          echo "::error::RDRSS.py 파일이 저장소에 없습니다."
          exit 1
        fi

        # BT4G 특유의 날짜 없음(TypeError)으로 스크립트가 멈추는 현상 패치
        sed -i "s/if (entry.updated_parsed > last_load_date):/if entry.get('updated_parsed') is None or (entry.updated_parsed > last_load_date):/g" RDRSS.py
        grep -q "entry.get('updated_parsed') is None" RDRSS.py \
          || echo "::warning::날짜 예외 패치가 적용되지 않았습니다. RDRSS.py 의 해당 줄이 바뀌었는지 확인하세요."

        python RDRSS.py --token "$REAL_DEBRID_TOKEN"

    - name: 2. 멀티 피드 순회 및 중복 마그넷 차단
      env:
        # =================================================================
        # 수집할 피드 주소를 한 줄에 하나씩 적어주세요.
        # 앞에 하이픈(-) 없이 같은 들여쓰기 칸에 맞춰 쓰면 됩니다.
        # 한글/한자 쿼리는 스크립트가 자동으로 URL 인코딩합니다.
        # '#'로 시작하는 줄은 무시되므로 임시로 끄고 싶은 피드에 쓰면 편합니다.
        # =================================================================
        MULTI_FEED_URLS: |
          https://bt4gprx.com/search?q=韩国&category=movie&page=rss
          https://bt4gprx.com/search?q=bydda.cc&category=movie&page=rss
          https://bt4gprx.com/search?q=국산&category=movie&page=rss
        # =================================================================
      run: python scripts/multi_feed.py

    - name: 3. 마그넷 이력 커밋 및 푸시
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        # 토큰이 들어 있을 수 있는 설정 파일은 삭제하고 Git 추적에서도 제외
        rm -f rdrss.json RDRSSconfig/*.json
        git rm -q -f --ignore-unmatch rdrss.json RDRSSconfig/rdrss.json

        # 1단계에서 sed 로 패치한 RDRSS.py 는 원상복구 (rebase 가 막히지 않도록)
        git restore --worktree RDRSS.py 2>/dev/null || true

        # 마그넷 이력 파일만 커밋 대상으로 지정
        git add RDRSSconfig/sent_magnets1.txt

        if git diff --staged --quiet; then
          echo "변경 사항이 없어 커밋하지 않습니다."
          exit 0
        fi

        git commit -m "chore: update sent magnet history [skip ci]"

        # 다른 워크플로와 push 가 겹칠 수 있으므로 rebase 후 최대 3회 재시도
        for i in 1 2 3; do
          if git pull --rebase origin "$GITHUB_REF_NAME" && git push; then
            exit 0
          fi
          echo "push 실패 (시도 $i/3), 잠시 후 재시도합니다."
          sleep $((i * 5))
        done

        echo "::error::git push 가 3회 모두 실패했습니다."
        exit 1
