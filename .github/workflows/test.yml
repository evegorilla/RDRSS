name: Run RDRSS Script

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: # 수동 실행 버튼

# 저장소에 상태 파일을 다시 푸시(Push)할 수 있도록 쓰기 권한을 부여합니다.
permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v4

    - name: 파이썬(Python) 설치
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: 의존성 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: RDRSS 소스코드 오류 패치 (BT4G 날짜 에러 방지)
      run: |
        # entry.updated_parsed가 None(없음)일 경우 오류가 나지 않도록 파이썬 코드를 한 줄 수정합니다.
        sed -i "s/if (entry.updated_parsed > last_load_date):/if (entry.get('updated_parsed') is None or entry.updated_parsed > last_load_date):/g" RDRSS.py

    - name: RDRSS 순차적 설정 빌드 및 실행
      env:
        RD_SECRET_TOKEN: ${{ secrets.REAL_DEBRID_TOKEN }}
      run: |
        # 1. Real-Debrid 토큰 등록
        python RDRSS.py --token "$RD_SECRET_TOKEN"
        
        # 2. 파이썬 반복문을 이용해 중복 없이 깔끔하게 피드 등록 (원하는 키워드는 여기에만 추가하면 됩니다)
        python -c "
        import subprocess, urllib.parse
        keywords = [
            'bydda.cc', '韩国', 'h264-f1rst 때리는', '골 때리는 그녀들 720p-NEXT',
            '국산', '마사지', '신작', 'VVIP', 
            '아라이 리마', '新井リマ', 'Arai Rima', '枫カレン', 'Karen Kaede'
        ]
        for kw in keywords:
            # 영화/비디오 카테고리로 필터링하여 불필요한 파일 유입 차단
            url = f'https://bt4gprx.com{urllib.parse.quote(kw)}&category=movie&page=rss'
            subprocess.run(['python', 'RDRSS.py', '--add', url])
        "

        # 3. 패치된 코드로 실행하여 Real-Debrid로 전송 시작
        python RDRSS.py

    - name: RDRSS 내부 설정 및 동기화 상태 파일 커밋 (중복 방지)
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # 스크립트가 임시로 생성한 RDRSSconfig 폴더 전체를 스테이징합니다.
        git add RDRSSconfig/
        
        # 날짜 기록 파일에 변경 사항이 생겼을 때만 커밋 및 푸시
        if ! git diff --staged --quiet; then
          git commit -m "chore: Update RDRSS feed dates [skip ci]"
          git push
        else
          echo "새로 추가된 RSS 피드가 없어 상태를 유지합니다."
        fi
