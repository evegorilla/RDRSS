name: Run RDRSS Script

on:
  schedule:
    - cron: '0 */6 * * *' # 6시간마다 자동 실행
  workflow_dispatch: # 수동 실행 버튼 활성화

# 전역(Global) 환경 변수에 Node 20 임시 사용 승인 플래그 지정
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v4

    - name: 파이썬(Python) 설치
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: 의존성 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: RDRSS 초기설정 및 실행
      run: |
        # 1. Real-Debrid 토큰과 RSS 피드를 강제로 config 디렉토리에 미리 생성
        mkdir -p RDRSSconfig
        
        # 주입할 rdrss.json 파일을 동적으로 생성
        echo '{
          "authToken": "${{ secrets.REAL_DEBRID_TOKEN }}",
          "rssUrls": [
            "https://bt4gprx.com",
            "https://bt4gprx.com"
          ],
          "updated": 0
        }' > ./RDRSSconfig/rdrss.json

        # 2. 준비된 설정을 바탕으로 Real-Debrid 선택 스크립트 실행
        python rdrss.py --select
