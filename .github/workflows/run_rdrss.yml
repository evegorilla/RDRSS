name: Run RDRSS Script

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v6

    - name: 파이썬 설치
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        
    - name: 의존성 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        python -m pip install feedparser
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 1. RDRSS 날짜 예외 패치 및 환경 세팅
      env:
        REAL_DEBRID_TOKEN: ${{ secrets.REAL_DEBRID_TOKEN }}
      run: |
        # BT4G 특유의 날짜 없음(TypeError)으로 스크립트가 멈추는 현상 패치
        sed -i "s/if (entry.updated_parsed > last_load_date):/if entry.get('updated_parsed') is None or (entry.updated_parsed > last_load_date):/g" RDRSS.py || true
        if [ ! -z "$REAL_DEBRID_TOKEN" ]; then python RDRSS.py --token "$REAL_DEBRID_TOKEN"; fi

    - name: 2. 피드 주입 및 수집 가동 (피드 직결형 마그넷 주소 기록 및 사전 차단 엔진)
      env:
        # =================================================================
        # ⭐ [여기에 원하는 피드 URL 주소를 입력하세요] ⭐
        # =================================================================
        TARGET_FEED_URL: "https://bt4gprx.com/search?q=h264-f1rst%20때리는&page=rss"
        # =================================================================
      run: |
        # 들여쓰기를 전면 배제한 단 한 줄짜리 완전 평면(Flat-line) 파이썬 아키텍처입니다.
        # 인라인 파이썬 에러 요인을 원천 차단하며, 원본 RSS 피드에서 마그넷 전체 주소(magnet:?xt=...)를 직접 파싱하여 100% 확실하게 강제 선행 저장합니다.
        python -c 'import os, json, feedparser; cf = "RDRSSconfig/rdrss.json"; mf = "RDRSSconfig/sent_magnets.txt"; os.makedirs("RDRSSconfig", exist_ok=True); open(mf, "a", encoding="utf-8").close() if not os.path.exists(mf) else None; target = os.environ.get("TARGET_FEED_URL", "").strip(); os.system(f"python RDRSS.py --add \"{target}\"") if target.lower() not in set(u.strip().lower() for u in set(json.load(open(cf, "r", encoding="utf-8")).get("rssUrls", [])) if os.path.exists(cf)) else print(f"[패스] 피드 이미 등록됨: {target}"); su = set(l.strip() for l in open(mf, "r", encoding="utf-8").readlines() if l.strip()); print("[피드 스캔] 새로운 피드 마그넷 주소 강제 보존 가동..."); [open(mf, "a", encoding="utf-8").write(str(e.link).strip() + "\n") or print(f"[💾 마그넷 전체 주소 강제 기록 완료] {e.title}") for e in feedparser.parse(target).entries if str(e.link).strip() and str(e.link).strip() not in su]; os.system("python RDRSS.py")'

    - name: 3. RDRSS 상태 및 마그넷 전체 주소 이력 보존 커밋
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        
        # 주소 기록이 강제로 실시간 축적되는 설정 폴더 전체를 형상관리에 병합합니다.
        git add RDRSSconfig/
        
        if ! git diff --staged --quiet; then
          git commit -m "chore: Force record raw magnet links and block duplicates [skip ci]"
          git push
        fi
