name: Run RDRSS Script

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v6

    - name: 파이썬(Python) 설치
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        
    - name: 의존성 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 중복 차단 및 안전한 RDRSS 스캔 실행
      env:
        RD_SECRET_TOKEN: ${{ secrets.REAL_DEBRID_TOKEN }}
      run: |
        cat << 'EOF' > run_filter.py
        import os
        import sys
        import json

        history_file = "RDRSSconfig/history_magnets.txt"
        config_file = "RDRSSconfig/rdrss.json"
        os.makedirs("RDRSSconfig", exist_ok=True)

        # 1. Real-Debrid 토큰 초기화 등록
        token = os.environ.get("RD_SECRET_TOKEN", "")
        if token:
            os.system(f'python RDRSS.py --token "{token}"')

        # 2. rdrss.json 내부의 기존 등록 URL 목록 파싱
        existing_urls = set()
        if os.path.exists(config_file):
            try:
                with open(config_file, "r", encoding="utf-8") as jf:
                    config_data = json.load(jf)
                    # rdrss.json의 실제 키값 구조인 rssUrls를 가져옵니다.
                    urls_list = config_data.get("rssUrls", [])
                    existing_urls = set(url.strip().lower() for url in urls_list)
            except Exception as e:
                print(f"[경고] rdrss.json 읽기 실패: {e}")

        # 3. 추가 타겟 피드 리스트
        target_feeds = [
            "https://bt4gprx.com/search?q=bydda.cc&category=movie&page=rss",
            "https://bt4gprx.com/search?q=韩国&category=movie&page=rss",
            "https://bt4gprx.com/search?q=h264-f1rst%20때리는&page=rss",
            "https://bt4gprx.com/search?q=골%20때리는%20그녀들%20720p-NEXT&page=rss",
            "https://bt4gprx.com/search?q=국산&category=movie&page=rss",
            "https://bt4gprx.com/search?q=마사지&category=movie&page=rss",
            "https://bt4gprx.com/search?q=신작&category=movie&page=rss",
            "https://bt4gprx.com/search?q=VVIP&category=movie&page=rss",
            "https://bt4gprx.com/search?q=あらいりま&category=movie&page=rss",
            "https://bt4gprx.com/search?q=新井リマ&category=movie&page=rss",
            "https://bt4gprx.com/search?q=Arai%20Rima&category=movie&page=rss",
            "https://bt4gprx.com/search?q=楓カレン&category=movie&page=rss",
            "https://bt4gprx.com/search?q=Karen%20Kaede&category=movie&page=rss"
        ]

        # 없는 URL만 골라 추가 진행
        for url in target_feeds:
            if url.strip().lower() not in existing_urls:
                print(f"[피드 등록] 신규 URL 추가 실행: {url}")
                os.system(f'python RDRSS.py --add "{url}"')

        # 4. 다운로드 완료된 마그넷 세트 불러오기
        downloaded = set()
        if os.path.exists(history_file):
            with open(history_file, "r", encoding="utf-8") as hf:
                downloaded = set(line.strip().lower() for line in hf if line.strip())

        # 5. RDRSS.py 핵심 로직 변조 소스 빌드
        with open("RDRSS.py", "r", encoding="utf-8") as f:
            source = f.read()

        # [패치 1] BT4G 특유의 날짜 없음(TypeError) 대책 마련
        source = source.replace(
            "if (entry.updated_parsed > last_load_date):",
            "if entry.get('updated_parsed') is None or (entry.updated_parsed > last_load_date):"
        )

        # [패치 2] 마그넷 수집문 가로채기 방식 고도화
        # 원본 소스코드의 가독성 및 들여쓰기 공백 편차 방지를 위해 유연하게 감지 처리합니다.
        replacement_code = """for title, magnet in magnets:
            magnet_clean = magnet.strip().lower()
            if magnet_clean in downloaded_magnets_global:
                print(f"[필터링 완료] 무한 중복 스킵: {title}")
                continue
            downloaded_magnets_global.add(magnet_clean)
            with open("RDRSSconfig/history_magnets.txt", "a", encoding="utf-8") as hf:
                hf.write(magnet_clean + "\\n")"""

        if "for title, magnet in magnets:" in source:
            source = source.replace("for title, magnet in magnets:", replacement_code)
        else:
            # 공백 들여쓰기가 스크립트에 따라 다를 경우 대안 검출
            source = source.replace("for title,magnet in magnets:", replacement_code)

        source = "downloaded_magnets_global = " + repr(downloaded) + "\n" + source

        with open("RDRSS_patched.py", "w", encoding="utf-8") as f:
            f.write(source)

        print("=== 중복 필터링 통합 패치 RDRSS 구동 시작 ===")
        exit_code = os.system("python RDRSS_patched.py")
        if exit_code != 0:
            sys.exit(exit_code)
        EOF
        
        python run_filter.py

    - name: 3. RDRSS 설정 데이터 및 마그넷 이력 파일 깃허브 커밋
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # 새로 추적되거나 변경된 RDRSSconfig 하위 폴더의 모든 데이터를 추가
        git add RDRSSconfig/
        
        if ! git diff --staged --quiet; then
          git commit -m "chore: Synchronize configuration and magnet history logs [skip ci]"
          git push
        fi
