name: Run RDRSS Script

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v6

    - name: 파이썬 설치
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        
    - name: 의존성 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        python -m pip install feedparser
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 1. RDRSS 날짜 예외 패치 및 환경 세팅
      env:
        REAL_DEBRID_TOKEN: ${{ secrets.REAL_DEBRID_TOKEN }}
      run: |
        # BT4G 특유의 날짜 없음(TypeError)으로 스크립트가 멈추는 현상 패치
        sed -i "s/if (entry.updated_parsed > last_load_date):/if entry.get('updated_parsed') is None or (entry.updated_parsed > last_load_date):/g" RDRSS.py || true
        if [ ! -z "$REAL_DEBRID_TOKEN" ]; then python RDRSS.py --token "$REAL_DEBRID_TOKEN"; fi

    - name: 2. 피드 주입 및 수집 가동 (실시간 중복 마그넷 원천 차단 커스텀 엔진)
      env:
        # =================================================================
        # ⭐ [여기에 원하는 피드 URL 주소를 입력하세요] ⭐
        # =================================================================
        TARGET_FEED_URL: "https://bt4gprx.com/search?q=h264-f1rst%20때리는&page=rss"
        # =================================================================
      run: |
        # 들여쓰기를 전면 배제한 단 한 줄짜리 완전 평면(Flat-line) 파이썬 가드 엔진입니다.
        # 기존에 성공한 마그넷 기록 로직을 그대로 보존하면서, 이미 보낸 마그넷은 RDRSS.py 엔진이 아예 보지 못하도록 피드 주입 단계를 조작하여 전송을 원천 차단합니다.
        python -c 'import os, json, feedparser; cf = "RDRSSconfig/rdrss.json"; mf = "RDRSSconfig/sent_magnets.txt"; os.makedirs("RDRSSconfig", exist_ok=True); open(mf, "a", encoding="utf-8").close() if not os.path.exists(mf) else None; target = os.environ.get("TARGET_FEED_URL", "").strip(); su = set(l.strip().lower() for l in open(mf, "r", encoding="utf-8").readlines() if l.strip()); print("[사전 검사] 피드 데이터 분석 및 중복 대조 스캔 중..."); new_entries = [e for e in feedparser.parse(target).entries if str(e.link).strip().lower() not in su]; [open(mf, "a", encoding="utf-8").write(str(e.link).strip() + "\n") or print(f"[💾 신규 마그넷 주소 강제 기록 완료] {e.title}") for e in new_entries]; urls = set(json.load(open(cf, "r", encoding="utf-8")).get("rssUrls", [])) if os.path.exists(cf) else set(); os.system(f"python RDRSS.py --add \"{target}\"") if target.lower() not in set(u.strip().lower() for u in urls) else None; (lambda: [print(f"[🛑 중복 차단 집행] 이번 피드의 모든 마그넷이 이미 과거에 전송되었습니다. 리얼디브리드 요청을 스킵합니다.") if not new_entries else [print(f"[🚀 전송 개시] 중복 제외 신규 마그넷 {len(new_entries)}건 발견. RDRSS 엔진 가동."), os.system("python RDRSS.py")]])()'

    - name: 3. RDRSS 상태 및 마그넷 전체 주소 이력 보존 커밋
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        
        # 주소 기록이 강제로 실시간 축적되는 설정 폴더 전체를 형상관리에 병합합니다.
        git add RDRSSconfig/
        
        if ! git diff --staged --quiet; then
          git commit -m "chore: Force record raw magnet links and block duplicates [skip ci]"
          git push
        fi
