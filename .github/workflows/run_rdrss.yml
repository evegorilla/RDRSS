name: Run RDRSS Script

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v6

    - name: 파이썬(Python) 설치
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        
    - name: 의존성 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 1. RDRSS 피드 예외 패치 및 최초 설정
      env:
        RD_SECRET_TOKEN: ${{ secrets.REAL_DEBRID_TOKEN }}
      run: |
        # BT4G 특유의 날짜 없음(TypeError)으로 스크립트가 멈추는 현상만 안전하게 한 줄 패치
        sed -i "s/if (entry.updated_parsed > last_load_date):/if entry.get('updated_parsed') is None or (entry.updated_parsed > last_load_date):/g" RDRSS.py || true

        # 토큰 세팅
        python RDRSS.py --token "$RD_SECRET_TOKEN"
        
        # rdrss.json 설정 파일이 없는 최초 실행 환경일 때만 RSS 피드 등록
        if [ ! -d "RDRSSconfig" ] || [ ! -f "RDRSSconfig/rdrss.json" ]; then
          echo "Initial setup: adding feeds..."
          python RDRSS.py --add "https://bt4gprx.com/search?q=h264-f1rst%20때리는&page=rss"
          fi

    - name: 2. RDRSS 기본 실행
      run: |
        # 순정 상태(날짜 예외만 처리된)로 정상 구동하여 토렌트를 수집합니다.
        python RDRSS.py

    - name: 3. Real-Debrid 서버단 중복 결함 강제 청소 (사후 필터)
      env:
        RD_SECRET_TOKEN: ${{ secrets.REAL_DEBRID_TOKEN }}
      run: |
        # Real-Debrid API를 직접 제어하는 독립 실행기를 생성합니다.
        cat << 'EOF' > rd_cleaner.py
        import os
        import urllib.request
        import json

        token = os.environ.get("RD_SECRET_TOKEN", "")
        if not token:
            print("토큰이 없어 사후 청소를 스킵합니다.")
            exit(0)

        try:
            # 1) 현재 리얼디브리드 토렌트 다운로드 목록 호출
            req = urllib.request.Request(
                "https://real-debrid.com",
                headers={"Authorization": f"Bearer {token}"}
            )
            with urllib.request.urlopen(req) as response:
                torrents = json.loads(response.read().decode())

            # 2) 파일 해시(Hash) 중복 대조 처리
            seen_hashes = set()
            duplicate_ids = []

            # 최신 항목이 위에 오므로, 먼저 나온 것을 유지하고 나중에 나오는 똑같은 해시는 중복 처리 대상이 됩니다.
            for t in torrents:
                thash = t.get("hash", "").lower()
                tid = t.get("id", "")
                if not thash or not tid:
                    continue
                
                if thash in seen_hashes:
                    duplicate_ids.append((tid, t.get("filename", "Unknown")))
                else:
                    seen_hashes.add(thash)

            # 3) 중복된 토렌트 원격 강제 삭제 실행
            if duplicate_ids:
                print(f"=== 총 {len(duplicate_ids)}개의 실시간 중복 다운로드 시도를 포착했습니다. 청소를 시작합니다. ===")
                for tid, name in duplicate_ids:
                    print(f"[중복 제거] Real-Debrid 클라우드에서 삭제 완료: {name} (ID: {tid})")
                    del_req = urllib.request.Request(
                        f"https://real-debrid.com/delete/{tid}",
                        method="DELETE",
                        headers={"Authorization": f"Bearer {token}"}
                    )
                    try:
                        with urllib.request.urlopen(del_req) as resp:
                            pass
                    except Exception as de:
                        print(f"삭제 실패 (ID: {tid}): {de}")
            else:
                print("=== 리얼디브리드가 말끔한 상태입니다. 중복 건이 발견되지 않았습니다. ===")

        except Exception as e:
            print(f"Real-Debrid API 연동 중 오류 발생: {e}")
        EOF

        python rd_cleaner.py

    - name: 4. RDRSS 설정 데이터 깃허브 커밋
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git add RDRSSconfig/
        
        if ! git diff --staged --quiet; then
          git commit -m "chore: Synchronize configuration [skip ci]"
          git push
        fi
