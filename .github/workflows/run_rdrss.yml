name: Run RDRSS Script

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v6

    - name: 파이썬(Python) 설치
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        
    - name: 의존성 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 중복 차단 및 안전한 RDRSS 스캔 실행
      env:
        RD_SECRET_TOKEN: ${{ secrets.REAL_DEBRID_TOKEN }}
      run: |
        cat << 'EOF' > run_filter.py
        import os
        import sys
        import json

        history_file = "RDRSSconfig/history_magnets.txt"
        feeds_file = "RDRSSconfig/feeds.json"
        os.makedirs("RDRSSconfig", exist_ok=True)

        # 1) 토큰 무조건 먼저 등록 (RDRSS 기본 초기화)
        token = os.environ.get("RD_SECRET_TOKEN", "")
        if token:
            os.system(f'python RDRSS.py --token "{token}"')

        # 2) JSON에 이미 존재하는 URL 목록 미리 확인 (중복 추가 방지)
        existing_urls = set()
        if os.path.exists(feeds_file):
            try:
                with open(feeds_file, "r", encoding="utf-8") as jf:
                    feeds_data = json.load(jf)
                    # 스크립트 내부 구조상 리스트 형태이거나 딕셔너리 형태일 수 있으므로 안전하게 파싱
                    if isinstance(feeds_data, list):
                        for item in feeds_data:
                            if isinstance(item, dict) and "url" in item:
                                existing_urls.add(item["url"].strip().lower())
                    elif isinstance(feeds_data, dict):
                        for k, v in feeds_data.items():
                            if isinstance(v, dict) and "url" in v:
                                existing_urls.add(v["url"].strip().lower())
            except Exception as e:
                print(f"[경고] 기존 feeds.json 읽기 실패 (새로 작성함): {e}")

        # 3) 추가할 피드 리스트 정의
        target_feeds = [
            "https://bt4gprx.com/search?q=bydda.cc&category=movie&page=rss",
            "https://bt4gprx.com/search?q=韩国&category=movie&page=rss",
            "https://bt4gprx.com/search?q=h264-f1rst%20때리는&page=rss",
            "https://bt4gprx.com/search?q=골%20때리는%20그녀들%20720p-NEXT&page=rss",
            "https://bt4gprx.com/search?q=국산&category=movie&page=rss",
            "https://bt4gprx.com/search?q=마사지&category=movie&page=rss",
            "https://bt4gprx.com/search?q=신작&category=movie&page=rss",
            "https://bt4gprx.com/search?q=VVIP&category=movie&page=rss",
            "https://bt4gprx.com/search?q=あらいりま&category=movie&page=rss",
            "https://bt4gprx.com/search?q=新井リマ&category=movie&page=rss",
            "https://bt4gprx.com/search?q=Arai%20Rima&category=movie&page=rss",
            "https://bt4gprx.com/search?q=楓カレン&category=movie&page=rss",
            "https://bt4gprx.com/search?q=Karen%20Kaede&category=movie&page=rss"
        ]

        # 4) 존재하지 않는 주소만 골라서 안전하게 --add 실행
        for url in target_feeds:
            if url.strip().lower() not in existing_urls:
                print(f"[피드 등록] 신규 URL 추가: {url}")
                os.system(f'python RDRSS.py --add "{url}"')
            else:
                print(f"[피드 패스] 이미 JSON에 존재하는 URL입니다: {url}")

        # 5) 마그넷 중복 차단 기록 로드
        downloaded = set()
        if os.path.exists(history_file):
            with open(history_file, "r", encoding="utf-8") as hf:
                downloaded = set(line.strip().lower() for line in hf if line.strip())

        # 6) 원본 RDRSS.py 소스코드 가로채기 및 패치
        with open("RDRSS.py", "r", encoding="utf-8") as f:
            source = f.read()

        # [패치 1] BT4G 날짜 에러 방지 (TypeError 대책)
        old_date_check = "if (entry.updated_parsed > last_load_date):"
        new_date_check = "if entry.get('updated_parsed') is None or (entry.updated_parsed > last_load_date):"
        source = source.replace(old_date_check, new_date_check)

        # [패치 2] 마그넷 중복 전송 방지 로직 주입
        replacement = """for title, magnet in magnets:
            magnet_clean = magnet.strip().lower()
            if magnet_clean in downloaded_magnets_global:
                print(f"[필터링] 중복 마그넷 제외 완료: {title}")
                continue
            downloaded_magnets_global.add(magnet_clean)
            with open("RDRSSconfig/history_magnets.txt", "a", encoding="utf-8") as hf:
                hf.write(magnet_clean + "\\n")"""

        source = "downloaded_magnets_global = " + repr(downloaded) + "\n" + source
        source = source.replace("for title, magnet in magnets:", replacement)

        with open("RDRSS_patched.py", "w", encoding="utf-8") as f:
            f.write(source)

        print("=== 중복 필터링을 적용한 RDRSS 스캔을 실행합니다 ===")
        exit_code = os.system("python RDRSS_patched.py")
        if exit_code != 0:
            sys.exit(exit_code)
        EOF
        
        # 통합 제어기 구동
        python run_filter.py

    - name: 3. RDRSS 데이터 및 동기화 상태 파일 깃허브 커밋
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        
        git add RDRSSconfig/
        
        if ! git diff --staged --quiet; then
          git commit -m "chore: Synchronize RDRSS feed updates and history [skip ci]"
          git push
        fi
