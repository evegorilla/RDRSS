name: Run RDRSS Script

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v6

    - name: 파이썬(Python) 설치
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        
    - name: 의존성 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 1. RDRSS 피드 연동 및 수집 가동 (JSON 중복 방지 정밀 제어)
      env:
        RD_SECRET_TOKEN: ${{ secrets.REAL_DEBRID_TOKEN }}
      run: |
        # BT4G 특유의 날짜 없음(TypeError)으로 스크립트가 멈추는 현상만 안전하게 한 줄 패치
        sed -i "s/if (entry.updated_parsed > last_load_date):/if entry.get('updated_parsed') is None or (entry.updated_parsed > last_load_date):/g" RDRSS.py || true

        # 안전한 실행을 위한 래퍼(Wrapper) 생성
        cat << 'EOF' > run_rdrss_safe.py
import os
import json
import sys

config_file = "RDRSSconfig/rdrss.json"
os.makedirs("RDRSSconfig", exist_ok=True)
token = os.environ.get("RD_SECRET_TOKEN", "")

# Real-Debrid 토큰 무조건 먼저 세팅
if token:
    os.system(f'python RDRSS.py --token "{token}"')

# rdrss.json 파일을 직접 읽어 이미 등록된 주소가 있는지 검증
existing_urls = set()
if os.path.exists(config_file):
    try:
        with open(config_file, "r", encoding="utf-8") as jf:
            config_data = json.load(jf)
            urls_list = config_data.get("rssUrls", [])
            existing_urls = set(url.strip().lower() for url in urls_list)
    except Exception as e:
        print(f"[경고] rdrss.json 구조 읽기 실패: {e}")

# 필터링할 타겟 피드 리스트
target_feeds = [
    "https://bt4gprx.com"
]

# rdrss.json 파일에 중복으로 들어가는 것을 원천 차단
for url in target_feeds:
    if url.strip().lower() not in existing_urls:
        print(f"[피드 등록] 신규 URL 추가: {url}")
        os.system(f'python RDRSS.py --add "{url}"')
    else:
        print(f"[피드 패스] 이미 rdrss.json 파일에 등록된 주소입니다: {url}")

# 핵심 크롤러 구동
os.system("python RDRSS.py")
EOF

        # 가드 스크립트 구동
        python run_rdrss_safe.py

    - name: 2. Real-Debrid 서버단 중복 결함 강제 청소 (안전 가드 필터)
      env:
        RD_SECRET_TOKEN: ${{ secrets.REAL_DEBRID_TOKEN }}
      run: |
        cat << 'EOF' > rd_cleaner.py
import os
import urllib.request
import json
import urllib.error

token = os.environ.get("RD_SECRET_TOKEN", "")
if not token:
    print("[오류] Repository Secrets에 REAL_DEBRID_TOKEN 값이 누락되었습니다.")
    exit(0)

try:
    # 끈겨있던 주소를 실제 토렌트 호출 전용 API 경로로 완벽하게 복구함
    req = urllib.request.Request(
        "https://real-debrid.com",
        headers={"Authorization": f"Bearer {token}"}
    )
    with urllib.request.urlopen(req) as response:
        raw_data = response.read().decode().strip()
        
    if not raw_data:
        print("=== 리얼디브리드 리스트가 비어있어 정리를 생략합니다. ===")
        exit(0)
        
    # 토큰 유효성 불일치로 로그인창 HTML이 날아오는 최악의 경우 예외 가드 가동
    if raw_data.startswith("<!DOCTYPE html") or "<html" in raw_data:
        print("\n[🚨 토큰 인증 실패] 수신된 응답이 JSON 형식이 아닌 로그인 HTML 페이지입니다.")
        print("REAL_DEBRID_TOKEN이 만료되었을 확률이 높으니 깃허브 Secrets 설정을 다시 확인해 주세요.\n")
        exit(0)

    torrents = json.loads(raw_data)
    seen_hashes = set()
    duplicate_ids = []

    # 잘려있던 핵심 반복 대조문 풀버전 빌드 완료
    for t in torrents:
        thash = t.get("hash", "").lower()
        tid = t.get("id", "")
        if not thash or not tid:
            continue
        
        if thash in seen_hashes:
            duplicate_ids.append((tid, t.get("filename", "Unknown")))
        else:
            seen_hashes.add(thash)

    # 사후 리얼디브리드 서버단 동기화 클렌징 연동
    if duplicate_ids:
        print(f"=== 총 {len(duplicate_ids)}개의 중복 다운로드 시도를 포착했습니다. 제거 작업을 가동합니다. ===")
        for tid, name in duplicate_ids:
            print(f"[중복 제거] Real-Debrid 원격 취소 완료: {name} (ID: {tid})")
            del_req = urllib.request.Request(
                f"https://real-debrid.com/delete/{tid}",
                method="DELETE",
                headers={"Authorization": f"Bearer {token}"}
            )
            try:
                with urllib.request.urlopen(del_req) as resp: pass
            except Exception as de: print(f"원격 명령 기각 (ID: {tid}): {de}")
    else:
        print("=== 리얼디브리드가 말끔한 상태입니다. 중복 건이 발견되지 않았습니다. ===")

except urllib.error.HTTPError as he:
    if he.code in:
        print("\n[🚨 인증 거부] Real-Debrid API 토큰 오류 (401/403). 토큰을 재발급 받아 입력해 주세요.\n")
    else:
        print(f"HTTP 네트워크 에러 발생 (코드: {he.code})")
except json.JSONDecodeError:
    print("\n[🚨 데이터 포맷 에러] 수신된 응답을 파싱할 수 없습니다. 토큰 만료를 확인하세요.\n")
except Exception as e:
    print(f"가드 시스템 작동 중 예외 포착: {e}")
EOF

        python rd_cleaner.py

    - name: 3. RDRSS 상태 보존 커밋
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        
        git add RDRSSconfig/
        
        if ! git diff --staged --quiet; then
          git commit -m "chore: Synchronize configuration [skip ci]"
          git push
        fi
