name: Run RDRSS Script

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v6

    - name: 파이썬 설치
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        
    - name: 의존성 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        python -m pip install feedparser
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 1. RDRSS 날짜 예외 패치 및 환경 세팅
      env:
        REAL_DEBRID_TOKEN: ${{ secrets.REAL_DEBRID_TOKEN }}
      run: |
        # BT4G 특유의 날짜 없음(TypeError)으로 스크립트가 멈추는 현상 패치
        sed -i "s/if (entry.updated_parsed > last_load_date):/if entry.get('updated_parsed') is None or (entry.updated_parsed > last_load_date):/g" RDRSS.py || true
        if [ ! -z "$REAL_DEBRID_TOKEN" ]; then python RDRSS.py --token "$REAL_DEBRID_TOKEN"; fi

    - name: 2. 마그넷 원시 주소 강제 추적 기록 및 사전 차단 가드 이식
      run: |
        # 들여쓰기를 전면 배제한 단 한 줄짜리 완전 평면(Flat-line) 파이썬 아키텍처입니다.
        # RDRSS.py 하단에 파일 기반 인터셉터를 직접 결합하여 리얼디브리드로 발송되는 모든 마그넷 주소를 100% 강제 포착 및 파일 기록합니다.
        python -c 'import os; mf = "RDRSSconfig/sent_magnets.txt"; os.makedirs("RDRSSconfig", exist_ok=True); open(mf, "a", encoding="utf-8").close() if not os.path.exists(mf) else None; code = open("RDRSS.py", "r", encoding="utf-8").read(); injector = f"\n\n# === 마그넷 강제 기록 및 중복 제거 가드 주입 ===\nimport urllib.request, json\ndef guard_add_magnet_interceptor(self, magnet_info):\n    mf_path = \x27{mf}\x27\n    m_url = str(magnet_info.get(\x27magnet\x27, \x27\x27)).strip()\n    if not m_url: m_url = f\x27magnet:?xt=urn:btih:{{magnet_info.get(\x27hash\x27, \x27\x27)}}\x27\n    sent_urls = set(line.strip() for line in open(mf_path, \x27r\x27, encoding=\x27utf-8\x27).readlines() if line.strip())\n    if m_url in sent_urls:\n        print(f\x27[🛑 전체 주소 사전 차단] 과거 전송했던 마그넷 주소이므로 스킵합니다: {{magnet_info.get(\x27filename\x27, \x27Unknown\x27)}}\x27)\n        return True\n    with open(mf_path, \x27a\x27, encoding=\x27utf-8\x27) as f_out: f_out.write(m_url + \x27\\n\x27)\n    print(f\x27[💾 마그넷 주소 강제 기록 완료] {{magnet_info.get(\x27filename\x27, \x27Unknown\x27)}}\x27)\n    try: return self._old_add_magnet(magnet_info)\n    except: return getattr(self, \x27_old_add_magnet\x27, lambda x: True)(magnet_info)\n\nfor cls_name in [\x27RealDebrid\x27, \x27RD\x27, \x27RealDebridAPI\x27, \x27RDRSS\x27]:\n    if cls_name in globals():\n        cls = globals()[cls_name]\n        for func_name in [\x27add_magnet\x27, \x27addMagnet\x27, \x27download_magnet\x27, \x27add_torrent\x27]:\n            if hasattr(cls, func_name):\n                cls._old_add_magnet = getattr(cls, func_name)\n                setattr(cls, func_name, guard_add_magnet_interceptor)\n                print(f\x27[성공] {{cls_name}}클래스의 {{func_name}} 전송 함수 가로채기 완료!\x27)\n"; open("RDRSS.py", "w", encoding="utf-8").write(code + injector); print("[완료] 오프라인 파일 기반 무결성 인터셉터 가드 결합 성공!")'

    - name: 3. 피드 주입 및 수집 가동
      env:
        # =================================================================
        # ⭐ [여기에 원하는 피드 URL 주소를 입력하세요] ⭐
        # =================================================================
        TARGET_FEED_URL: "https://bt4gprx.com/search?q=h264-f1rst%20때리는&page=rss"
        # =================================================================
      run: |
        # 마그넷 주소 전체 기록 구조로 개조된 엔진을 가동합니다. 들여쓰기 에러 요소가 없습니다.
        python -c 'import os, json; cf = "RDRSSconfig/rdrss.json"; os.makedirs("RDRSSconfig", exist_ok=True); urls = set(json.load(open(cf, "r", encoding="utf-8")).get("rssUrls", [])) if os.path.exists(cf) else set(); target = os.environ.get("TARGET_FEED_URL", "").strip(); os.system(f"python RDRSS.py --add \"{target}\"") if target.lower() not in set(u.strip().lower() for u in urls) else print(f"[패스] 피드 주소 이미 등록됨: {target}"); os.system("python RDRSS.py")'

    - name: 4. RDRSS 상태 및 마그넷 전체 주소 이력 보존 커밋
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        
        # 설정 파일 및 마그넷 전체 주소가 적힌 텍스트 로그 파일을 스테이징합니다.
        git add RDRSSconfig/
        
        if ! git diff --staged --quiet; then
          git commit -m "chore: Force record raw magnet links and block duplicates [skip ci]"
          git push
        fi
