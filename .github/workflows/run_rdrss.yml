name: Run RDRSS Script

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v6

    - name: 파이썬(Python) 설치
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        
    - name: 의존성 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: RDRSS 소스코드 오류 패치 (안전한 날짜 처리)
      run: |
        # entry.updated_parsed가 없더라도 에러를 뿜지 않고, 기존 last_load_date와 충돌하여 중복 다운로드되지 않도록 패치합니다.
        sed -i "s/if (entry.updated_parsed > last_load_date):/if entry.get('updated_parsed') is not None and entry.updated_parsed > last_load_date:/g" RDRSS.py

    - name: RDRSS 순차적 설정 빌드 및 실행
      env:
        RD_SECRET_TOKEN: ${{ secrets.REAL_DEBRID_TOKEN }}
      run: |
        # 1. Real-Debrid 토큰 등록
        python RDRSS.py --token "$RD_SECRET_TOKEN"
        
        # 2. RSS 피드가 기존에 등록되어 있지 않은 최초 실행 상태일 때만 피드 주소들을 등록합니다.
        # RDRSSconfig 폴더나 내부에 피드 설정 파일이 없을 때만 구동되도록 제어하여 중복 추가를 원천 차단합니다.
        if [ ! -d "RDRSSconfig" ] || [ ! -f "RDRSSconfig/feeds.json" ]; then
          echo "최초 실행: RSS 피드 주소들을 등록합니다."
          python RDRSS.py --add "https://bt4gprx.com/search?q=bydda.cc&category=movie&page=rss"
          python RDRSS.py --add "https://bt4gprx.com/search?q=韩国&category=movie&page=rss"
          python RDRSS.py --add "https://bt4gprx.com/search?q=h264-f1rst%20때리는&page=rss"
          python RDRSS.py --add "https://bt4gprx.com/search?q=골%20때리는%20그녀들%20720p-NEXT&page=rss"
          python RDRSS.py --add "https://bt4gprx.com/search?q=국산&category=movie&page=rss"
          python RDRSS.py --add "https://bt4gprx.com/search?q=마사지&category=movie&page=rss"
          python RDRSS.py --add "https://bt4gprx.com/search?q=신작&category=movie&page=rss"
          python RDRSS.py --add "https://bt4gprx.com/search?q=VVIP&category=movie&page=rss"
          python RDRSS.py --add "https://bt4gprx.com/search?q=あらいりま&category=movie&page=rss"
          python RDRSS.py --add "https://bt4gprx.com/search?q=新井リマ&category=movie&page=rss"
          python RDRSS.py --add "https://bt4gprx.com/search?q=Arai%20Rima&category=movie&page=rss"
          python RDRSS.py --add "https://bt4gprx.com/search?q=楓カレン&category=movie&page=rss"
          python RDRSS.py --add "https://bt4gprx.com/search?q=Karen%20Kaede&category=movie&page=rss"
        else
          echo "기존에 등록된 RSS 피드 구성을 재사용하여 업데이트를 스캔합니다."
        fi

        # 3. 새로운 마그넷 링크만 Real-Debrid로 전송 시작
        python RDRSS.py

    - name: RDRSS 내부 설정 및 동기화 상태 파일 커밋 (중복 방지 핵심)
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # 스크립트가 갱신한 토큰, 피드 정보, 마지막 다운로드 날짜가 담긴 폴더를 스테이징합니다.
        git add RDRSSconfig/
        
        # 동기화 상태(날짜 기록 등)에 변경 사항이 생겼을 때만 깃허브에 다시 푸시하여 다음 20분 뒤 실행 시 기억하도록 합니다.
        if ! git diff --staged --quiet; then
          git commit -m "chore: Update RDRSS feed dates [skip ci]"
          git push
        fi
