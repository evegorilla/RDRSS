name: Run RDRSS Script

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v6

    - name: 파이썬(Python) 설치
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        
    - name: 의존성 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: RDRSS 무한 중복 전송 방지 핵패치 (마그넷 해시 필터링)
      run: |
        # 1. BT4G의 부실한 날짜 데이터(None) 오류 우회 패치
        sed -i "s/if (entry.updated_parsed > last_load_date):/if entry.get('updated_parsed') is not None and entry.updated_parsed > last_load_date:/g" RDRSS.py

        # 2. 파이썬 스크립트 내부 주입 방식의 마그넷 중복 링크 필터 빌드
        # 이미 처리한 마그넷 주소는 history_magnets.txt에 영구 저장하여 다중 필터링합니다.
        python - << 'EOF'
        with open("RDRSS.py", "r", encoding="utf-8") as f:
            code = f.read()

        # 중복 마그넷 체크용 커스텀 파이썬 로직 정의
        injection_code = """
    # --- 중복 차단 커스텀 로직 시작 ---
    import os
    history_file = "RDRSSconfig/history_magnets.txt"
    os.makedirs("RDRSSconfig", exist_ok=True)
    if not os.path.exists(history_file):
        with open(history_file, "w") as hf: pass
    with open(history_file, "r") as hf:
        downloaded_magnets = set(hf.read().splitlines())
    
    # 중복 주소면 Real-Debrid 추가 스킵
    if magnet in downloaded_magnets:
        print(f"Skipping duplicate magnet: {title}")
        continue
        
    # 신규 주소면 기록 추가
    with open(history_file, "a") as hf:
        hf.write(magnet + "\\n")
    # --- 중복 차단 커스텀 로직 끝 ---
        """

        # 실제 마그넷 주소를 Real-Debrid API로 쏘는 반복문 초입부를 찾아 로직을 강제 주입합니다.
        target_str = "for title, magnet in magnets:"
        if target_str in code and "history_magnets.txt" not in code:
            code = code.replace(target_str, target_str + injection_code)
            with open("RDRSS.py", "w", encoding="utf-8") as f:
                f.write(code)
            print("Successfully injected Magnet Hash Filter into RDRSS.py")
        else:
            print("Filter already injected or target pattern not found.")
        EOF

    - name: RDRSS 순차적 설정 빌드 및 실행
      env:
        RD_SECRET_TOKEN: ${{ secrets.REAL_DEBRID_TOKEN }}
      run: |
        # 1. Real-Debrid 토큰 등록
        python RDRSS.py --token "$RD_SECRET_TOKEN"
        
        # 2. 피드 데이터가 담긴 JSON이 없을 때만 최초 1회 RSS 주소 등록
        if [ ! -d "RDRSSconfig" ] || [ ! -f "RDRSSconfig/feeds.json" ]; then
          echo "최초 실행: RSS 피드 주소들을 등록합니다."
          python RDRSS.py --add "https://bt4gprx.com"
          python RDRSS.py --add "https://bt4gprx.com"
          python RDRSS.py --add "https://bt4gprx.com"
          python RDRSS.py --add "https://bt4gprx.com"
          python RDRSS.py --add "https://bt4gprx.com"
          python RDRSS.py --add "https://bt4gprx.com"
          python RDRSS.py --add "https://bt4gprx.com"
          python RDRSS.py --add "https://bt4gprx.com"
          python RDRSS.py --add "https://bt4gprx.com"
          python RDRSS.py --add "https://bt4gprx.com"
          python RDRSS.py --add "https://bt4gprx.com"
          python RDRSS.py --add "https://bt4gprx.com"
          python RDRSS.py --add "https://bt4gprx.com"
        else
          echo "기존에 등록된 RSS 피드 구성을 재사용하여 업데이트를 스캔합니다."
        fi

        # 3. 강화 패치된 상태로 전송 스크립트 실행
        python RDRSS.py

    - name: RDRSS 내부 설정 및 마그넷 이력 파일 커밋 (중복 방지 핵심)
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # 다운로드 완료된 마그넷 해시 목록 파일과 피드 설정 폴더를 커밋 후보에 추가합니다.
        git add RDRSSconfig/
        
        # 새로운 마그넷 다운로드 기록이 추가되었을 때만 깃허브 저장소로 푸시(기억)합니다.
        if ! git diff --staged --quiet; then
          git commit -m "chore: Update RDRSS data and history logs [skip ci]"
          git push
        fi
