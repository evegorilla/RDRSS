name: Run RDRSS Script

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v6

    - name: 파이썬(Python) 설치
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        
    - name: 의존성 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 1. RDRSS 기본 피드 설정 생성 (최초 1회만)
      env:
        RD_SECRET_TOKEN: ${{ secrets.REAL_DEBRID_TOKEN }}
      run: |
        # 토큰 등록
        python RDRSS.py --token "$RD_SECRET_TOKEN"
        
        # 설정 파일이 존재하지 않는 최초 구동 시에만 피드들을 배치 등록합니다.
        if [ ! -d "RDRSSconfig" ] || [ ! -f "RDRSSconfig/feeds.json" ]; then
          echo "Initial setup: adding feeds..."
          python RDRSS.py --add "https://bt4gprx.com/search?q=bydda.cc&category=movie&page=rss"
          python RDRSS.py --add "https://bt4gprx.com/search?q=韩国&category=movie&page=rss"
          python RDRSS.py --add "https://bt4gprx.com/search?q=h264-f1rst%20때리는&page=rss"
          python RDRSS.py --add "https://bt4gprx.com/search?q=골%20때리는%20그녀들%20720p-NEXT&page=rss"
          python RDRSS.py --add "https://bt4gprx.com/search?q=국산&category=movie&page=rss"
          python RDRSS.py --add "https://bt4gprx.com/search?q=마사지&category=movie&page=rss"
          python RDRSS.py --add "https://bt4gprx.com/search?q=신작&category=movie&page=rss"
          python RDRSS.py --add "https://bt4gprx.com/search?q=VVIP&category=movie&page=rss"
          python RDRSS.py --add "https://bt4gprx.com/search?q=あらいりま&category=movie&page=rss"
          python RDRSS.py --add "https://bt4gprx.com/search?q=新井リマ&category=movie&page=rss"
          python RDRSS.py --add "https://bt4gprx.com/search?q=Arai%20Rima&category=movie&page=rss"
          python RDRSS.py --add "https://bt4gprx.com/search?q=楓カレン&category=movie&page=rss"
          python RDRSS.py --add "https://bt4gprx.com/search?q=Karen%20Kaede&category=movie&page=rss"
        fi

    - name: 2. 중복 없는 마그넷 필터링 및 리얼디브리드 전송 제어 실행
      run: |
        cat << 'EOF' > run_filter.py
        import os
        import re
        import sys

        history_file = "RDRSSconfig/history_magnets.txt"
        os.makedirs("RDRSSconfig", exist_ok=True)

        # 1) 기존에 다운로드 완료된 마그넷 목록 로드
        downloaded = set()
        if os.path.exists(history_file):
            with open(history_file, "r", encoding="utf-8") as hf:
                downloaded = set(line.strip().lower() for line in hf if line.strip())

        # 2) 원본 RDRSS.py 소스코드 로드
        with open("RDRSS.py", "r", encoding="utf-8") as f:
            source = f.read()

        # [패치 1] BT4G 날짜 에러 방지 구문 강제 변환 (None 검사 추가)
        old_date_check = "if (entry.updated_parsed > last_load_date):"
        new_date_check = "if entry.get('updated_parsed') is None or (entry.updated_parsed > last_load_date):"
        source = source.replace(old_date_check, new_date_check)

        # [패치 2] 마그넷 해시 2중 필터링 주입
        replacement = """for title, magnet in magnets:
            magnet_clean = magnet.strip().lower()
            if magnet_clean in downloaded_magnets_global:
                print(f"[필터링] 중복 마그넷 제외 완료: {title}")
                continue
            downloaded_magnets_global.add(magnet_clean)
            with open("RDRSSconfig/history_magnets.txt", "a", encoding="utf-8") as hf:
                hf.write(magnet_clean + "\\n")"""

        source = "downloaded_magnets_global = " + repr(downloaded) + "\n" + source
        source = source.replace("for title, magnet in magnets:", replacement)

        # 개조본 작성 및 구동
        with open("RDRSS_patched.py", "w", encoding="utf-8") as f:
            f.write(source)

        print("=== 중복 및 날짜 필터링을 적용한 RDRSS 스캔을 실행합니다 ===")
        exit_code = os.system("python RDRSS_patched.py")
        if exit_code != 0:
            sys.exit(exit_code)
        EOF
        
        python run_filter.py

    - name: 3. RDRSS 데이터 및 동기화 상태 파일 깃허브 커밋
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        
        git add RDRSSconfig/
        
        if ! git diff --staged --quiet; then
          git commit -m "chore: Synchronize RDRSS feed updates and history [skip ci]"
          git push
        fi
