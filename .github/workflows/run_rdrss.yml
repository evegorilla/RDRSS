name: Run RDRSS Script

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v6

    - name: 파이썬(Python) 설치
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        
    - name: 의존성 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 1. RDRSS 날짜 예외 패치 및 환경 세팅
      env:
        RD_SECRET_TOKEN: ${{ secrets.REAL_DEBRID_TOKEN }}
      run: |
        # BT4G 특유의 날짜 없음(TypeError)으로 스크립트가 멈추는 현상 패치
        sed -i "s/if (entry.updated_parsed > last_load_date):/if entry.get('updated_parsed') is None or (entry.updated_parsed > last_load_date):/g" RDRSS.py || true

        # 토큰 등록 및 초기 피드 구성 환경 마련
        if [ ! -z "$RD_SECRET_TOKEN" ]; then
          python RDRSS.py --token "$RD_SECRET_TOKEN"
        fi

    - name: 2. 중복 등록 방지 피드 주입 및 수집 구동
      run: |
        # 파일 쓰기 방식으로 꼬임 없는 외부 래퍼 스크립트 생성
        echo 'import os, json' > run_rdrss_safe.py
        echo 'config_file = "RDRSSconfig/rdrss.json"' >> run_rdrss_safe.py
        echo 'os.makedirs("RDRSSconfig", exist_ok=True)' >> run_rdrss_safe.py
        echo 'existing_urls = set()' >> run_rdrss_safe.py
        echo 'if os.path.exists(config_file):' >> run_rdrss_safe.py
        echo '    try:' >> run_rdrss_safe.py
        echo '        with open(config_file, "r", encoding="utf-8") as jf:' >> run_rdrss_safe.py
        echo '            existing_urls = set(url.strip().lower() for url in json.load(jf).get("rssUrls", []))' >> run_rdrss_safe.py
        echo '    except: pass' >> run_rdrss_safe.py
        echo 'target_feed = "https://bt4gprx.com/search?q=h264-f1rst%20때리는&page=rss"' >> run_rdrss_safe.py
        echo 'if target_feed.strip().lower() not in existing_urls:' >> run_rdrss_safe.py
        echo '    print(f"[피드 등록] 신규 URL 추가: {target_feed}")' >> run_rdrss_safe.py
        echo '    os.system(f"python RDRSS.py --add \"{target_feed}\"")' >> run_rdrss_safe.py
        echo 'else:' >> run_rdrss_safe.py
        echo '    print(f"[피드 패스] 이미 등록된 주소입니다: {target_feed}")' >> run_rdrss_safe.py
        echo 'os.system("python RDRSS.py")' >> run_rdrss_safe.py
        
        python run_rdrss_safe.py

    - name: 3. Real-Debrid 서버단 실시간 중복 결함 원격 강제 청소
      env:
        RD_SECRET_TOKEN: ${{ secrets.REAL_DEBRID_TOKEN }}
      run: |
        # 중복 전송된 토렌트를 파괴하는 독립 실행형 청소기 파일 빌드 (안전한 정식 API 주소 매핑)
        echo 'import os, urllib.request, json' > rd_cleaner.py
        echo 'token = os.environ.get("RD_SECRET_TOKEN", "")' >> rd_cleaner.py
        echo 'if token:' >> rd_cleaner.py
        echo '    try:' >> rd_cleaner.py
        echo '        req = urllib.request.Request("https://real-debrid.com", headers={"Authorization": f"Bearer {token}"})' >> rd_cleaner.py
        echo '        with urllib.request.urlopen(req) as resp: raw = resp.read().decode().strip()' >> rd_cleaner.py
        echo '        if raw and not raw.startswith("<!DOCTYPE") and "<html" not in raw:' >> rd_cleaner.py
        echo '            torrents = json.loads(raw)' >> rd_cleaner.py
        echo '            seen, dup_ids = set(), []' >> rd_cleaner.py
        echo '            for t in torrents:' >> rd_cleaner.py
        echo '                thash, tid = t.get("hash", "").lower(), t.get("id", "")' >> rd_cleaner.py
        echo '                if thash and tid:' >> rd_cleaner.py
        echo '                    if thash in seen: dup_ids.append((tid, t.get("filename", "Unknown")))' >> rd_cleaner.py
        echo '                    else: seen.add(thash)' >> rd_cleaner.py
        echo '            if dup_ids:' >> rd_cleaner.py
        echo '                print(f"=== {len(dup_ids)}개의 중복 내역 포착 ===")' >> rd_cleaner.py
        echo '                for tid, name in dup_ids:' >> rd_cleaner.py
        echo '                    print(f"[중복 제거] 원격 삭제: {name}")' >> rd_cleaner.py
        echo '                    d_req = urllib.request.Request(f"https://real-debrid.com/delete/{tid}", method="DELETE", headers={"Authorization": f"Bearer {token}"})' >> rd_cleaner.py
        echo '                    try:' >> rd_cleaner.py
        echo '                        with urllib.request.urlopen(d_req) as d_resp: pass' >> rd_cleaner.py
        echo '                    except: pass' >> rd_cleaner.py
        echo '            else: print("=== 중복 파일이 없는 말끔한 상태입니다. ===")' >> rd_cleaner.py
        echo '    except Exception as e: print(f"오류: {e}")' >> rd_cleaner.py
        
        python rd_cleaner.py

    - name: 4. RDRSS 상태 보존 커밋
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        
        git add RDRSSconfig/
        
        if ! git diff --staged --quiet; then
          git commit -m "chore: Synchronize configuration [skip ci]"
          git push
        fi
