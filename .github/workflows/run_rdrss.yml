name: Run RDRSS Script

on:
  schedule:
    - cron: '0 */6 * * *' # 6시간마다 자동으로 실행 (원하는 주기로 변경 가능)
  workflow_dispatch: # Actions 탭에서 수동으로 실행하고 싶을 때 사용

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v4

    - name: 파이썬(Python) 설치
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 의존성 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: RDRSS 스크립트 실행
      env:
        # 2단계에서 설정한 Secret을 환경변수로 주입
        REAL_DEBRID_API_TOKEN: ${{ secrets.REAL_DEBRID_TOKEN }} 
      run: |
        python rdrss.py
    - name: RDRSS 스크립트 실행
      env:
        REAL_DEBRID_API_TOKEN: ${{ secrets.REAL_DEBRID_TOKEN }} 
      run: |
        # 예시 1: config.json을 지정해야 하는 경우
        python rdrss.py --add "https://bt4gprx.com/search?q=bydda.cc&category=movie&page=rss"
        
        # 만약 옵션을 모른다면 도움말을 출력하게 하여 로그를 확인해볼 수도 있습니다.
        # python rdrss.py --help
