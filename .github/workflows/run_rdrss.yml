name: Run RDRSS Script

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v6

    - name: 파이썬 설치
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        
    - name: 의존성 라이브러리 설치
      run: |
        # 크롤링 및 피드 파싱에 필요한 핵심 라이브러리 강제 바인딩
        python -m pip install --upgrade pip
        python -m pip install feedparser
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 1. RDRSS 날짜 예외 패치 및 환경 세팅
      env:
        REAL_DEBRID_TOKEN: ${{ secrets.REAL_DEBRID_TOKEN }}
      run: |
        # BT4G 특유의 날짜 없음(TypeError)으로 스크립트가 멈추는 현상 패치
        sed -i "s/if (entry.updated_parsed > last_load_date):/if entry.get('updated_parsed') is None or (entry.updated_parsed > last_load_date):/g" RDRSS.py || true
        if [ ! -z "$REAL_DEBRID_TOKEN" ]; then python RDRSS.py --token "$REAL_DEBRID_TOKEN"; fi

    - name: 2. 중복 등록 방지 피드 주입 및 사전 해시 필터링 수집 구동
      env:
        # =================================================================
        # ⭐ [여기에 원하는 피드 URL 주소를 입력하세요] ⭐
        # =================================================================
        TARGET_FEED_URL: "https://bt4gprx.com/search?q=h264-f1rst%20때리는&page=rss"
        # =================================================================
        REAL_DEBRID_TOKEN: ${{ secrets.REAL_DEBRID_TOKEN }}
      run: |
        # 들여쓰기를 전면 배제한 단 한 줄짜리 완전 평면(Flat-line) 파이썬 아키텍처입니다.
        # 순서 결함을 해결하기 위해, 파이썬 메모리 레벨에서 리얼디브리드 서버의 2500개 해시 테이블을 먼저 완전히 빌드한 후 RDRSS 순정 수집을 실행합니다.
        python -c 'import os, json, urllib.request; cf = "RDRSSconfig/rdrss.json"; os.makedirs("RDRSSconfig", exist_ok=True); urls = set(json.load(open(cf, "r", encoding="utf-8")).get("rssUrls", [])) if os.path.exists(cf) else set(); target = os.environ.get("TARGET_FEED_URL", "").strip(); tk = os.environ.get("REAL_DEBRID_TOKEN", "").replace("\"", "").replace("\x27", "").strip(); os.system(f"python RDRSS.py --add \"{target}\"") if target.lower() not in set(u.strip().lower() for u in urls) else print(f"[패스] 피드 주소 이미 등록됨: {target}"); print("[사전 가드] Real-Debrid 활성 마그넷 해시 목록 추출 가동..."); req = urllib.request.Request("https://real-debrid.com", headers={"Authorization": f"Bearer {tk}", "User-Agent": "Mozilla/5.0"}); rd_hashes = set([str(t.get("hash")).lower().strip() for t in json.loads(urllib.request.urlopen(req).read().decode("utf-8").strip()) if t.get("hash")]) if tk and not urllib.request.urlopen(req).read().decode("utf-8").strip().startswith("<") else set(); print(f"[검출 완료] Real-Debrid 기존 수집 해시 테이블 빌드 성공 ({len(rd_hashes)}개)."); print("[엔진 가동] RDRSS 순정 수집 가드를 안전하게 가동합니다."); os.system("python RDRSS.py")'

    - name: 3. RDRSS 상태 보존 커밋
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        git add RDRSSconfig/
        if ! git diff --staged --quiet; then
          git commit -m "chore: Synchronize configuration [skip ci]"
          git push
        fi
