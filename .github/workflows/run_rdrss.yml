name: Run RDRSS Script

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v6

    - name: 파이썬 설치
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        
    - name: 의존성 설치
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 1. RDRSS 날짜 예외 패치 및 환경 세팅
      env:
        RD_SECRET_TOKEN: ${{ secrets.REAL_DEBRID_TOKEN }}
      run: |
        # BT4G 특유의 날짜 없음(TypeError)으로 스크립트가 멈추는 현상 패치
        sed -i "s/if (entry.updated_parsed > last_load_date):/if entry.get('updated_parsed') is None or (entry.updated_parsed > last_load_date):/g" RDRSS.py || true
        if [ ! -z "$RD_SECRET_TOKEN" ]; then python RDRSS.py --token "$RD_SECRET_TOKEN"; fi

    - name: 2. 중복 등록 방지 피드 주입 및 수집 구동
      run: |
        # 한 줄 단위 echo 쓰기로 들여쓰기 꼬임(IndentationError) 현상을 기술적으로 원천 완전 봉쇄합니다.
        echo 'import os, json' > run_rdrss_safe.py
        echo 'cf = "RDRSSconfig/rdrss.json"' >> run_rdrss_safe.py
        echo 'os.makedirs("RDRSSconfig", exist_ok=True)' >> run_rdrss_safe.py
        echo 'urls = set()' >> run_rdrss_safe.py
        echo 'if os.path.exists(cf):' >> run_rdrss_safe.py
        echo '    try:' >> run_rdrss_safe.py
        echo '        with open(cf, "r", encoding="utf-8") as f: urls = set(u.strip().lower() for u in json.load(f).get("rssUrls", []))' >> run_rdrss_safe.py
        echo '    except: pass' >> run_rdrss_safe.py
        echo 'target = "https://bt4gprx.com"' >> run_rdrss_safe.py
        echo 'if target.strip().lower() not in urls: os.system("python RDRSS.py --add \"{}\"".format(target))' >> run_rdrss_safe.py
        echo 'os.system("python RDRSS.py")' >> run_rdrss_safe.py
        
        # 래퍼 프로세스 안전하게 원터치 구동
        python run_rdrss_safe.py

    - name: 3. Real-Debrid 클라우드 중복 해시 전수조사 및 강제 청소
      env:
        RD_SECRET_TOKEN: ${{ secrets.REAL_DEBRID_TOKEN }}
      run: |
        # 한 줄 단위 echo 쓰기로 들여쓰기 꼬임(IndentationError) 현상을 기술적으로 원천 완전 봉쇄합니다.
        echo 'import os, urllib.request, json' > rd_cleaner.py
        echo 'tk = os.environ.get("RD_SECRET_TOKEN", "")' >> rd_cleaner.py
        echo 'if tk:' >> rd_cleaner.py
        echo '    try:' >> rd_cleaner.py
        echo '        req = urllib.request.Request("https://real-debrid.com", headers={"Authorization": "Bearer {}".format(tk)})' >> rd_cleaner.py
        echo '        with urllib.request.urlopen(req) as r: raw = r.read().decode().strip()' >> rd_cleaner.py
        echo '        if raw and not raw.startswith("<"):' >> rd_cleaner.py
        echo '            seen, dups = set(), []' >> rd_cleaner.py
        echo '            for t in json.loads(raw):' >> rd_cleaner.py
        echo '                h, i = t.get("hash", "").lower(), t.get("id", "")' >> rd_cleaner.py
        echo '                if h and i:' >> rd_cleaner.py
        echo '                    if h in seen: dups.append((i, t.get("filename", "Unknown")))' >> rd_cleaner.py
        echo '                    else: seen.add(h)' >> rd_cleaner.py
        echo '            if dups:' >> rd_cleaner.py
        echo '                print("=== [검출 완료] 총 {}개의 중복 내역 포착 ===".format(len(dups)))' >> rd_cleaner.py
        echo '                for i, name in dups:' >> rd_cleaner.py
        echo '                    print("[실시간 원격 제거] {}".format(name))' >> rd_cleaner.py
        echo '                    d_req = urllib.request.Request("https://real-debrid.com{}".format(i), method="DELETE", headers={"Authorization": "Bearer {}".format(tk)})' >> rd_cleaner.py
        echo '                    try:' >> rd_cleaner.py
        echo '                        with urllib.request.urlopen(d_req) as dr: pass' >> rd_cleaner.py
        echo '                    except: pass' >> rd_cleaner.py
        echo '            else: print("=== [안정] 중복 유입 파일이 없는 깨끗한 상태입니다. ===")' >> rd_cleaner.py
        echo '    except: pass' >> rd_cleaner.py
        
        # 사후 가드 원격 삭제 프로세서 구동
        python rd_cleaner.py

    - name: 4. RDRSS 상태 보존 커밋
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        git add RDRSSconfig/
        if ! git diff --staged --quiet; then
          git commit -m "chore: Synchronize configuration [skip ci]"
          git push
        fi
