name: Run RDRSS Script

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v4

    - name: 파이썬(Python) 설치
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 의존성 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: RDRSS 초기설정 및 실행
      run: |
        # 1. Real-Debrid 토큰과 RSS 피드를 강제로 config 디렉토리에 미리 생성
        mkdir -p RDRSSconfig
        
        # 만약 secrets에 토큰을 설정했다면 사용할 수 있으나, 
        # rdrss.py는 처음에 rdrss.py --token "값" 구조로 넣거나 json을 직접 빌드해줘야 합니다.
        # 안전하게 json 파일을 직접 동적으로 선언해 주는 방식입니다.
        echo '{
          "authToken": "${{ secrets.REAL_DEBRID_TOKEN }}",
          "rssUrls": ["https://bt4gprx.com/search?q=bydda.cc&category=movie&page=rss", "https://bt4gprx.com/search?q=h264-f1rst 때리는&page=rss"],
          "updated": 0
        }' > ./RDRSSconfig/rdrss.json

        # 2. 준비된 설정을 바탕으로 Real-Debrid 선택 스크립트 실행
        python rdrss.py --select
