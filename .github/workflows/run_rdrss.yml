name: Run RDRSS Script

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v6

    - name: 파이썬 설치
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        
    - name: 의존성 설치
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 1. RDRSS 날짜 예외 패치 및 환경 세팅
      env:
        RD_SECRET_TOKEN: ${{ secrets.REAL_DEBRID_TOKEN }}
      run: |
        # BT4G 특유의 날짜 없음(TypeError)으로 스크립트가 멈추는 현상 패치
        sed -i "s/if (entry.updated_parsed > last_load_date):/if entry.get('updated_parsed') is None or (entry.updated_parsed > last_load_date):/g" RDRSS.py || true
        if [ ! -z "$RD_SECRET_TOKEN" ]; then python RDRSS.py --token "$RD_SECRET_TOKEN"; fi

    - name: 2. 중복 등록 방지 피드 주입 및 수집 구동
      env:
        # =================================================================
        # ⭐ [여기에 원하는 피드 URL 주소를 입력하세요] ⭐
        # =================================================================
        TARGET_FEED_URL: "https://bt4gprx.com/search?q=h264-f1rst%20때리는&page=rss"
        # =================================================================
      run: |
        # 들여쓰기가 전면 배제된 완전 평면형 아키텍처로 rdrss.json 주소 증식을 통제합니다.
        python -c 'import os, json; cf = "RDRSSconfig/rdrss.json"; os.makedirs("RDRSSconfig", exist_ok=True); urls = set(json.load(open(cf, "r", encoding="utf-8")).get("rssUrls", [])) if os.path.exists(cf) else set(); target = os.environ.get("TARGET_FEED_URL", "").strip(); os.system(f"python RDRSS.py --add \"{target}\"") if target.lower() not in set(u.strip().lower() for u in urls) else print(f"[패스] 이미 등록됨: {target}"); os.system("python RDRSS.py")'

    - name: 3. Real-Debrid 클라우드 중복 해시 전수조사 및 강제 청소
      env:
        RD_SECRET_TOKEN: ${{ secrets.REAL_DEBRID_TOKEN }}
      run: |
        # echo 주입 아키텍처를 결합하여 들여쓰기 에러를 완전 소멸시킨 프로페셔널 클렌저 가드 빌드
        echo "import os, urllib.request, json" > real_debrid_cleaner.py
        echo "tk = os.environ.get('RD_SECRET_TOKEN', '')" >> real_debrid_cleaner.py
        echo "if tk:" >> real_debrid_cleaner.py
        echo "    try:" >> real_debrid_cleaner.py
        echo "        req = urllib.request.Request('https://real-debrid.com', headers={'Authorization': 'Bearer {}'.format(tk)})" >> real_debrid_cleaner.py
        echo "        with urllib.request.urlopen(req) as r: raw = r.read().decode().strip()" >> real_debrid_cleaner.py
        echo "        if raw and not raw.startswith('<'):" >> real_debrid_cleaner.py
        echo "            seen_hashes = set()" >> real_debrid_cleaner.py
        echo "            duplicate_ids = []" >> real_debrid_cleaner.py
        echo "            for t in json.loads(raw):" >> real_debrid_cleaner.py
        echo "                thash = t.get('hash', '').lower().strip()" >> real_debrid_cleaner.py
        echo "                tid = t.get('id', '')" >> real_debrid_cleaner.py
        echo "                if thash and tid:" >> real_debrid_cleaner.py
        echo "                    if thash in seen_hashes:" >> real_debrid_cleaner.py
        echo "                        duplicate_ids.append((tid, t.get('filename', 'Unknown')))" >> real_debrid_cleaner.py
        echo "                    else:" >> real_debrid_cleaner.py
        echo "                        seen_hashes.add(thash)" >> real_debrid_cleaner.py
        echo "            if duplicate_ids:" >> real_debrid_cleaner.py
        echo "                print('=== [중복 검출] 총 {}개의 실시간 중복 건이 적발되었습니다. ==='.format(len(duplicate_ids)))" >> real_debrid_cleaner.py
        echo "                for tid, name in duplicate_ids:" >> real_debrid_cleaner.py
        echo "                    print('[실시간 강제 청소] 파일명: {}'.format(name))" >> real_debrid_cleaner.py
        echo "                    d_req = urllib.request.Request('https://real-debrid.com{}'.format(tid), method='DELETE', headers={'Authorization': 'Bearer {}'.format(tk)})" >> real_debrid_cleaner.py
        echo "                    try:" >> real_debrid_cleaner.py
        echo "                        with urllib.request.urlopen(d_req) as dr: pass" >> real_debrid_cleaner.py
        echo "                    except: pass" >> real_debrid_cleaner.py
        echo "            else: print('=== [안정] 중복 유입 파일이 없는 완벽히 깨끗한 상태입니다. ===')" >> real_debrid_cleaner.py
        echo "    except Exception as e: print('가드 에러 발생: {}'.format(e))" >> real_debrid_cleaner.py

        # 정밀 교정 완료된 청소 엔진을 구동합니다.
        python real_debrid_cleaner.py

    - name: 4. RDRSS 상태 보존 커밋
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        git add RDRSSconfig/
        if ! git diff --staged --quiet; then
          git commit -m "chore: Synchronize configuration [skip ci]"
          git push
        fi
