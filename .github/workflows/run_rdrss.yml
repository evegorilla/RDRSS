name: Run RDRSS Script

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v6

    - name: 파이썬 설치
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        
    - name: 의존성 설치
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 1. RDRSS 날짜 예외 패치 및 환경 세팅
      env:
        RD_SECRET_TOKEN: ${{ secrets.REAL_DEBRID_TOKEN }}
      run: |
        # BT4G 특유의 날짜 없음(TypeError)으로 스크립트가 멈추는 현상 패치
        sed -i "s/if (entry.updated_parsed > last_load_date):/if entry.get('updated_parsed') is None or (entry.updated_parsed > last_load_date):/g" RDRSS.py || true
        if [ ! -z "$RD_SECRET_TOKEN" ]; then python RDRSS.py --token "$RD_SECRET_TOKEN"; fi

    - name: 2. 중복 등록 방지 피드 주입 및 수집 구동
      run: |
        # 들여쓰기를 전면 배제한 단 한 줄짜리 완전 평면(Flat-line) 파이썬 빌더를 가동합니다.
        python -c 'import os, json; cf = "RDRSSconfig/rdrss.json"; os.makedirs("RDRSSconfig", exist_ok=True); urls = set(json.load(open(cf, "r", encoding="utf-8")).get("rssUrls", [])) if os.path.exists(cf) else set(); target = "https://bt4gprx.com"; os.system(f"python RDRSS.py --add \"{target}\"") if target.strip().lower() not in set(u.strip().lower() for u in urls) else print(f"[패스] 이미 등록됨: {target}"); os.system("python RDRSS.py")'

    - name: 3. Real-Debrid 클라우드 중복 해시 전수조사 및 강제 청소
      env:
        RD_SECRET_TOKEN: ${{ secrets.REAL_DEBRID_TOKEN }}
      run: |
        # 들여쓰기를 전면 배제한 단 한 줄짜리 완전 평면(Flat-line) 파이썬 빌더를 가동합니다.
        # 50개 제한 해제(?limit=2500) 및 정식 엔드포인트를 적용한 실시간 원격 청소기입니다.
        python -c 'import os, urllib.request, json; tk = os.environ.get("RD_SECRET_TOKEN", ""); (lambda: [None for t in json.loads(urllib.request.urlopen(urllib.request.Request("https://real-debrid.com", headers={"Authorization": f"Bearer {tk}"})).read().decode().strip()) if not t.get("hash", "").lower() in seen and not seen.add(t.get("hash", "").lower()) and print(f"[유지] {t.get(\"filename\", \"Unknown\")}") or (print(f"[실시간 중복 제거] {t.get(\"filename\", \"Unknown\")}") or urllib.request.urlopen(urllib.request.Request(f"https://real-debrid.com{t.get(\"id\", \"\")}", method="DELETE", headers={"Authorization": f"Bearer {tk}"})))])() if tk and not (raw := urllib.request.urlopen(urllib.request.Request("https://real-debrid.com", headers={"Authorization": f"Bearer {tk}"})).read().decode().strip()).startswith("<") and (seen := set()) is not None else print("인증 만료 또는 데이터 공백으로 리턴합니다.")'

    - name: 4. RDRSS 상태 보존 커밋
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        git add RDRSSconfig/
        if ! git diff --staged --quiet; then
          git commit -m "chore: Synchronize configuration [skip ci]"
          git push
        fi
