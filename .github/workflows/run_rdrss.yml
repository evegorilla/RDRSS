name: Run RDRSS Script

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v6

    - name: 파이썬(Python) 설치
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        
    - name: 의존성 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: RDRSS 소스코드 오류 패치 (BT4G 날짜 에러 방지)
      run: |
        # entry.updated_parsed가 None(없음)일 경우 오류가 나지 않도록 파이썬 코드를 한 줄 수정합니다.
        sed -i "s/if (entry.updated_parsed > last_load_date):/if (entry.get('updated_parsed') is None or entry.updated_parsed > last_load_date):/g" RDRSS.py

    - name: RDRSS 순차적 설정 빌드 및 실행
      env:
        RD_SECRET_TOKEN: ${{ secrets.REAL_DEBRID_TOKEN }}
      run: |
        # 1. Real-Debrid 토큰 등록
        python RDRSS.py --token "$RD_SECRET_TOKEN"
        
        # 2. RSS 피드 주소 등록
        python RDRSS.py --add "https://bt4gprx.com/search?q=bydda.cc&category=movie&page=rss"
        python RDRSS.py --add "https://bt4gprx.com/search?q=韩国&category=movie&page=rss"
        python RDRSS.py --add "https://bt4gprx.com/search?q=h264-f1rst%20때리는&page=rss"
        python RDRSS.py --add "https://bt4gprx.com/search?q=골%20때리는%20그녀들%20720p-NEXT&page=rss"
        python RDRSS.py --add "https://bt4gprx.com/search?q=국산&category=movie&page=rss"
        python RDRSS.py --add "https://bt4gprx.com/search?q=마사지&category=movie&page=rss"
        python RDRSS.py --add "https://bt4gprx.com/search?q=신작&category=movie&page=rss"
        python RDRSS.py --add "https://bt4gprx.com/search?q=VVIP&category=movie&page=rss"
        python RDRSS.py --add "https://bt4gprx.com/search?q=あらいりま&category=movie&page=rss"
        python RDRSS.py --add "https://bt4gprx.com/search?q=新井リマ&category=movie&page=rss"
        python RDRSS.py --add "https://bt4gprx.com/search?q=Arai%20Rima&category=movie&page=rss"
        python RDRSS.py --add "https://bt4gprx.com/search?q=楓カレン&category=movie&page=rss"
        python RDRSS.py --add "https://bt4gprx.com/search?q=Karen%20Kaede&category=movie&page=rss"

        # 3. 패치된 코드로 실행하여 Real-Debrid로 전송 시작
        python RDRSS.py


    - name: RDRSS 내부 설정 및 동기화 상태 파일 커밋 (중복 방지)
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # 스크립트가 임시로 생성한 RDRSSconfig 폴더 전체를 스테이징합니다.
        git add RDRSSconfig/
        
        # 날짜 기록 파일에 변경 사항이 생겼을 때만 커밋 및 푸시
        if ! git diff --staged --quiet; then
          git commit -m "chore: Update RDRSS feed dates [skip ci]"
          git push
        else
          echo "새로 추가된 RSS 피드가 없어 상태를 유지합니다."
        fi
