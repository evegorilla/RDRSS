name: Run RDRSS Script

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v6

    - name: 파이썬(Python) 설치
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        
    - name: 의존성 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 1. RDRSS 날짜 예외 패치 및 환경 세팅
      env:
        RD_SECRET_TOKEN: ${{ secrets.REAL_DEBRID_TOKEN }}
      run: |
        # BT4G 특유의 날짜 없음(TypeError)으로 스크립트가 멈추는 현상 패치
        sed -i "s/if (entry.updated_parsed > last_load_date):/if entry.get('updated_parsed') is None or (entry.updated_parsed > last_load_date):/g" RDRSS.py || true

        # 토큰 등록 및 피드 주소 등록
        if [ ! -z "$RD_SECRET_TOKEN" ]; then
          python RDRSS.py --token "$RD_SECRET_TOKEN"
        fi

    - name: 2. 중복 등록 방지 피드 주입 및 수집 구동
      run: |
        # rdrss.json 파일을 직접 제어하여 중복 URL 누적을 원천 차단하는 정제 프로세스
        python -c '
import os, json
config_file = "RDRSSconfig/rdrss.json"
os.makedirs("RDRSSconfig", exist_ok=True)
existing_urls = set()

if os.path.exists(config_file):
    try:
        with open(config_file, "r", encoding="utf-8") as jf:
            existing_urls = set(url.strip().lower() for url in json.load(jf).get("rssUrls", []))
    except:
        pass

target_feed = "https://bt4gprx.com"
if target_feed.strip().lower() not in existing_urls:
    print(f"[피드 등록] 신규 URL 추가: {target_feed}")
    os.system(f"python RDRSS.py --add \"{target_feed}\"")
else:
    print(f"[피드 패스] 이미 등록된 주소입니다: {target_feed}")
'
        # RDRSS 순정 엔진 수집 구동
        python RDRSS.py

    - name: 3. Real-Debrid 서버단 실시간 중복 결함 원격 강제 청소
      env:
        RD_SECRET_TOKEN: ${{ secrets.REAL_DEBRID_TOKEN }}
      run: |
        # 중복 전송된 토렌트를 리얼디브리드 서버에서 직접 조회하여 실시간 파괴
        python -c '
import os, urllib.request, json, urllib.error
token = os.environ.get("RD_SECRET_TOKEN", "")
if not token:
    print("토큰이 없어 청소를 스킵합니다.")
    exit(0)

try:
    req = urllib.request.Request("https://real-debrid.com", headers={"Authorization": f"Bearer {token}"})
    with urllib.request.urlopen(req) as resp:
        raw = resp.read().decode().strip()
    
    if not raw or raw.startswith("<!DOCTYPE") or "<html" in raw:
        print("[🚨 인증 알림] 응답이 올바르지 않습니다. 토큰이 비었거나 만료되었는지 확인하세요.")
        exit(0)

    torrents = json.loads(raw)
    seen, dup_ids = set(), []
    for t in torrents:
        thash = t.get("hash", "").lower()
        tid = t.get("id", "")
        if thash and tid:
            if thash in seen:
                dup_ids.append((tid, t.get("filename", "Unknown")))
            else:
                seen.add(thash)

    if dup_ids:
        print(f"=== {len(dup_ids)}개의 중복 내역을 포착했습니다. 청소를 시작합니다. ===")
        for tid, name in dup_ids:
            print(f"[중복 제거] Real-Debrid 원격 취소: {name}")
            d_req = urllib.request.Request(f"https://real-debrid.com/delete/{tid}", method="DELETE", headers={"Authorization": f"Bearer {token}"})
            try:
                with urllib.request.urlopen(d_req) as d_resp: pass
            except: pass
    else:
        print("=== 중복 파일이 없는 말끔한 상태입니다. ===")
except Exception as e:
    print(f"가드 시스템 예외 처리: {e}")
'

    - name: 4. RDRSS 상태 보존 커밋
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        
        git add RDRSSconfig/
        
        if ! git diff --staged --quiet; then
          git commit -m "chore: Synchronize configuration [skip ci]"
          git push
        fi
