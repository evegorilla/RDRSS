name: Run RDRSS Script

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v6

    - name: 파이썬 설치
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        
    - name: 의존성 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        python -m pip install feedparser
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 1. RDRSS 날짜 예외 패치 및 환경 세팅
      env:
        REAL_DEBRID_TOKEN: ${{ secrets.REAL_DEBRID_TOKEN }}
      run: |
        # BT4G 특유의 날짜 없음(TypeError)으로 스크립트가 멈추는 현상 패치
        sed -i "s/if (entry.updated_parsed > last_load_date):/if entry.get('updated_parsed') is None or (entry.updated_parsed > last_load_date):/g" RDRSS.py || true
        if [ ! -z "$REAL_DEBRID_TOKEN" ]; then python RDRSS.py --token "$REAL_DEBRID_TOKEN"; fi

    - name: 2. 마그넷 원시 주소 강제 추적 기록 및 사전 차단 가드 이식
      run: |
        # heredoc 구조를 활용하여 따옴표나 중괄호 충돌이 전혀 없는 무결성 패치 파일을 임시 생성합니다.
        cat << 'EOF' > patch_rdrss.py
import os

mf_dir = "RDRSSconfig"
mf_path = "RDRSSconfig/sent_magnets.txt"
os.makedirs(mf_dir, exist_ok=True)

if not os.path.exists(mf_path):
    open(mf_path, "a", encoding="utf-8").close()

def guard_add_magnet_interceptor(self, magnet_info):
    m_url = str(magnet_info.get("magnet", "")).strip()
    if not m_url:
        m_url = "magnet:?xt=urn:btih:" + str(magnet_info.get("hash", "")).strip()
    
    # 저장된 내역 전수조사
    with open(mf_path, "r", encoding="utf-8") as f_in:
        sent_urls = set(line.strip() for line in f_in.readlines() if line.strip())
        
    if m_url in sent_urls:
        print("[🛑 전체 주소 사전 차단] 과거 전송했던 마그넷 주소이므로 스킵합니다: " + str(magnet_info.get("filename", "Unknown")))
        return True
        
    # 무조건 강제 선행 기록 처리
    with open(mf_path, "a", encoding="utf-8") as f_out:
        f_out.write(m_url + "\n")
    print("[💾 마그넷 주소 강제 기록 완료] " + str(magnet_info.get("filename", "Unknown")))
    
    try:
        return self._old_add_magnet(magnet_info)
    except:
        return getattr(self, "_old_add_magnet", lambda x: True)(magnet_info)

# 원본 RDRSS.py를 읽어와 동적으로 함수를 리바인딩하는 코드를 최하단에 주입합니다.
with open("RDRSS.py", "r", encoding="utf-8") as f:
    orig_code = f.read()

injector = """

# === 동적 인터셉터 바인딩 가드 ===
import patch_rdrss
for cls_name in ["RealDebrid", "RD", "RealDebridAPI", "RDRSS"]:
    if cls_name in globals():
        cls = globals()[cls_name]
        for func_name in ["add_magnet", "addMagnet", "download_magnet", "add_torrent"]:
            if hasattr(cls, func_name):
                cls._old_add_magnet = getattr(cls, func_name)
                setattr(cls, func_name, patch_rdrss.guard_add_magnet_interceptor)
                print(f"[성공] {cls_name} 클래스의 {func_name} 전송 함수 실시간 가로채기 완료!")
"""

with open("RDRSS.py", "w", encoding="utf-8") as f:
    f.write(orig_code + injector)

print("[완료] 오프라인 파일 기반 무결성 인터셉터 가드 결합 성공!")
EOF
        # 패치 환경 구축 가동
        python patch_rdrss.py

    - name: 3. 피드 주입 및 수집 가동
      env:
        # =================================================================
        # ⭐ [여기에 원하는 피드 URL 주소를 입력하세요] ⭐
        # =================================================================
        TARGET_FEED_URL: "https://bt4gprx.com/search?q=h264-f1rst%20때리는&page=rss"
        # =================================================================
      run: |
        # 마그넷 주소 전체 기록 구조로 개조된 엔진을 가동합니다.
        python -c 'import os, json; cf = "RDRSSconfig/rdrss.json"; os.makedirs("RDRSSconfig", exist_ok=True); urls = set(json.load(open(cf, "r", encoding="utf-8")).get("rssUrls", [])) if os.path.exists(cf) else set(); target = os.environ.get("TARGET_FEED_URL", "").strip(); os.system(f"python RDRSS.py --add \"{target}\"") if target.lower() not in set(u.strip().lower() for u in urls) else print(f"[패스] 피드 주소 이미 등록됨: {target}"); os.system("python RDRSS.py")'

    - name: 4. RDRSS 상태 및 마그넷 전체 주소 이력 보존 커밋
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        
        # 설정 파일 및 마그넷 전체 주소가 적힌 텍스트 로그 파일을 스테이징합니다.
        git add RDRSSconfig/
        
        if ! git diff --staged --quiet; then
          git commit -m "chore: Force record raw magnet links and block duplicates [skip ci]"
          git push
        fi
