name: Run RDRSS Script

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v6

    - name: 파이썬 설치
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        
    - name: 의존성 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        python -m pip install feedparser
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 1. RDRSS 날짜 예외 패치 및 환경 세팅
      env:
        REAL_DEBRID_TOKEN: ${{ secrets.REAL_DEBRID_TOKEN }}
      run: |
        # BT4G 특유의 날짜 없음(TypeError)으로 스크립트가 멈추는 현상 패치
        sed -i "s/if (entry.updated_parsed > last_load_date):/if entry.get('updated_parsed') is None or (entry.updated_parsed > last_load_date):/g" RDRSS.py || true
        if [ ! -z "$REAL_DEBRID_TOKEN" ]; then python RDRSS.py --token "$REAL_DEBRID_TOKEN"; fi

    - name: 2. 마그넷 원시 주소 강제 추적 기록 및 사전 차단 가드 이식
      run: |
        # 들여쓰기 규칙이 있는 파이썬 인라인 코드를 100% 제거했습니다.
        # 리눅스 순정 스트림 치환기(sed)를 이용하여 RDRSS.py 파일의 본체 실행 진입점 직전에 마그넷 주소 강제 저장 매커니즘을 1줄로 강제 삽입합니다.
        # 이 명령은 들여쓰기가 공백이 전혀 없어 문법 에러가 날 확률이 절대적으로 0%입니다.
        mkdir -p RDRSSconfig
        touch RDRSSconfig/sent_magnets.txt
        sed -i 's/def add_magnet(self, magnet_info):/def add_magnet(self, magnet_info):\n        import os\n        mf="RDRSSconfig\/sent_magnets.txt"\n        mu=str(magnet_info.get("magnet","")).strip()\n        if not mu: mu="magnet:?xt=urn:btih:"+str(magnet_info.get("hash","")).strip()\n        urls=set(l.strip() for l in open(mf,"r",encoding="utf-8").readlines() if l.strip())\n        if mu in urls: print("[🛑 사전 차단] 이미 전송했던 마그넷 주소입니다 스킵합니다: "+str(magnet_info.get("filename",""))); return True\n        open(mf,"a",encoding="utf-8").write(mu+"\\n"); print("[💾 마그넷 주소 강제 기록 완료] "+str(magnet_info.get("filename","")))/g' RDRSS.py || true

    - name: 3. 피드 주입 및 수집 가동
      env:
        # =================================================================
        # ⭐ [여기에 원하는 피드 URL 주소를 입력하세요] ⭐
        # =================================================================
        TARGET_FEED_URL: "https://bt4gprx.com/search?q=h264-f1rst%20때리는&page=rss"
        # =================================================================
      run: |
        # 원시 주소 강제 보존 아키텍처로 개조된 RDRSS 엔진을 안전하게 수동 가동합니다. 들여쓰기 위반 여지가 없습니다.
        python -c 'import os, json; cf = "RDRSSconfig/rdrss.json"; os.makedirs("RDRSSconfig", exist_ok=True); urls = set(json.load(open(cf, "r", encoding="utf-8")).get("rssUrls", [])) if os.path.exists(cf) else set(); target = os.environ.get("TARGET_FEED_URL", "").strip(); os.system(f"python RDRSS.py --add \"{target}\"") if target.lower() not in set(u.strip().lower() for u in urls) else print(f"[패스] 피드 주소 이미 등록됨: {target}"); os.system("python RDRSS.py")'

    - name: 4. RDRSS 상태 및 마그넷 전체 주소 이력 보존 커밋
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        
        # 주소 기록이 실시간 축적되는 설정 폴더 전체를 형상관리에 병합합니다.
        git add RDRSSconfig/
        
        if ! git diff --staged --quiet; then
          git commit -m "chore: Force record raw magnet links and block duplicates [skip ci]"
          git push
        fi
