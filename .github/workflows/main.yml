name: Run RDRSS Script 2

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v6

    - name: 파이썬(Python) 설치
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        
    - name: 의존성 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: RDRSS 순차적 설정 빌드 및 실행
      env:
        RD_SECRET_TOKEN: ${{ secrets.REAL_DEBRID_TOKEN }}
      run: |
        # 1. Real-Debrid 토큰 등록
        python RDRSS.py --token "$RD_SECRET_TOKEN"
        
        # 2. RSS 피드 주소 등록 (공백을 %20 또는 + 기호로 안전하게 치환)
        python RDRSS.py --add "https://bt4gprx.com/search?q=h264-f1rst%20때리는&page=rss"
        python RDRSS.py --add "https://bt4gprx.com/search?q=골%20때리는%20그녀들%20720p-NEXT&page=rss"
        
        # 3. 순수 실행하여 Real-Debrid로 피드 전송 시작
        python RDRSS.py
