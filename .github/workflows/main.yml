name: Run RDRSS Script 2

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v6

    - name: 파이썬(Python) 설치
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        
    - name: 의존성 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: RDRSS 순차적 설정 빌드 및 실행
      env:
        RD_SECRET_TOKEN: ${{ secrets.REAL_DEBRID_TOKEN }}
      run: |
        # 1. RDRSS 공식 명령어를 이용해 Real-Debrid 토큰을 시스템에 안전하게 등록합니다.
        python RDRSS.py --token "$RD_SECRET_TOKEN"
        
        # 2. 수집할 RSS 피드 주소들을 하나씩 시스템에 등록합니다.
        python RDRSS.py --add "https://bt4gprx.com/search?q=골 때리는 그녀들 720p-NEXT&page=rss"
        python RDRSS.py --add "https://bt4gprx.com/search?q=h264-f1rst 때리는&page=rss"
        
        # 3. 설정 등록이 완벽히 끝난 상태에서 인자 없이 '순수 실행'을 하여 RSS 수집을 시작합니다.
        python RDRSS.py
