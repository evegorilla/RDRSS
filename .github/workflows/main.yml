name: Run RDRSS Script 2

on:
  schedule:
    - cron: '*/15 * * * *' # 15분마다 자동 실행 (참고: GitHub Action 스케줄러 특성상 실제론 20~30분 주기로 실행될 수 있습니다)
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v6

    - name: 파이썬(Python) 설치
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        
    - name: 의존성 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: RDRSS 초기설정 및 실행
      env:
        # GitHub Secrets에 등록한 토큰을 안전하게 가상 환경 변수로 가져옵니다
        RD_SECRET_TOKEN: ${{ secrets.REAL_DEBRID_TOKEN }}
      run: |
        # 1. RDRSS가 실제 참조하는 홈 디렉토리 하위의 올바른 config 폴더 생성
        mkdir -p ~/.config/RDRSS
        
        # 2. 올바른 경로에 rdrss.json 파일 동적 생성 (Secrets 토큰 주입)
        echo '{
          "authToken": "'"$RD_SECRET_TOKEN"'",
          "rssUrls": [
            "https://bt4gprx.com/search?q=bydda.cc&category=movie&page=rss",
            "https://bt4gprx.com/search?q=h264-f1rst 때리는&page=rss"
          ],
          "updated": 0
        }' > ~/.config/RDRSS/rdrss.json

        # 3. 아무 인자도 주지 않고 실행해야 비로소 RSS 피드를 긁어서 Real-Debrid로 전송합니다.
        python RDRSS.py
